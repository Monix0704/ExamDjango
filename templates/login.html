<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish — MiniBlog</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap"
          rel="stylesheet">
</head>
<body>

<nav>
    <a href="{% url 'home' %}" class="nav-brand">Mini<span>Blog</span></a>
    <div class="nav-links">
        <a href="{% url 'login' %}">Kirish</a>
        <a href="{% url 'register' %}" class="btn-nav">Ro'yxatdan o'tish</a>
    </div>
</nav>

<div class="auth-wrap">
    <div class="auth-card">
        <h1>Xush kelibsiz</h1>
        <p class="subtitle">Hisobingizga kiring</p>

        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Foydalanuvchi nomi</label>
                <input type="text" id="username" name="username"
                       placeholder="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Parol</label>
                <input type="password" id="password" name="password"
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Kirish →</button>
        </form>

        <div class="divider">yoki</div>
        <div class="auth-footer">
            Hisobingiz bo'qmi? <a href="{% url 'register' %}">Ro'yxatdan o'ting</a>
        </div>
    </div>
</div>

<footer>&copy; 2025 MiniBlog</footer>
</body>
</html>
